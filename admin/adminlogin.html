<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f18">
  <title>Đăng nhập Admin | STARFLY</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(120deg,rgba(5,8,15,.84),rgba(5,8,15,.57)),url("https://image.tmdb.org/t/p/original/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg") center/cover fixed,#0b0f18;color:#f3f5f8;font:15px "Segoe UI",sans-serif}.card{width:min(440px,100%);padding:34px;border:1px solid #ffffff48;border-radius:20px;background:rgba(13,17,27,.58);backdrop-filter:blur(15px);box-shadow:0 24px 90px #0008}.brand{color:#d8ef72;font-weight:800;letter-spacing:.16em}.eyebrow{margin:28px 0 7px;color:#a9d75a;font-size:11px;font-weight:700;letter-spacing:.16em}h1{margin:0 0 9px;font-size:29px;font-weight:600}p{color:#aeb5c2;line-height:1.6}.field{display:grid;gap:8px;margin-top:17px}.field label{color:#aeb5c2;font-size:13px}.field input{height:47px;padding:0 13px;border:1px solid #ffffff50;border-radius:10px;background:#0d122097;color:white;font:inherit;outline:none}.field input:focus{border-color:#d8ef72}.submit{width:100%;height:47px;margin-top:23px;border:0;border-radius:10px;background:#d8ef72;color:#11170b;font-weight:700;font:inherit;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.error{display:none;margin:14px 0 0;padding:11px 12px;border:1px solid #854f58;border-radius:9px;background:#4a2028;color:#ffc0c0;line-height:1.45}.error.show{display:block}.back{display:inline-block;margin-top:21px;color:#d8ef72;text-decoration:none;font-size:13px}
  </style>
</head>
<body><main class="card"><div class="brand">STARFLY</div><div class="eyebrow">KHU VỰC QUẢN TRỊ</div><h1>Đăng nhập admin</h1><p>Đăng nhập bằng tài khoản quản trị để tiếp tục.</p>
  <form id="loginForm"><div class="field"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div class="error" id="error" role="alert"></div><button class="submit" id="submit" type="submit">Đăng nhập</button></form>
  <a class="back" href="/">← Quay về STARFLY</a></main>
  <script>const form=document.getElementById("loginForm"),errorBox=document.getElementById("error"),button=document.getElementById("submit"),username=document.getElementById("username"),password=document.getElementById("password");form.addEventListener("submit",async(event)=>{event.preventDefault();errorBox.classList.remove("show");button.disabled=true;button.textContent="Đang đăng nhập…";try{const response=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"Không đăng nhập được.");location.replace("/admin/");}catch(error){errorBox.textContent=error.message;errorBox.classList.add("show");}finally{button.disabled=false;button.textContent="Đăng nhập";}});</script>
</body></html>
