<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />
  <title>STARFLY — Admin Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#101522;--line:rgba(255,255,255,.09);--muted:#8d96a8;--text:#f4f5f7;--lime:#d8ef72;--red:#ff8585}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 84% 0%,#1a2437 0,transparent 35%),var(--bg);color:var(--text);font:14px "DM Sans",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:25px 16px;border-right:1px solid var(--line);background:rgba(8,11,18,.86);backdrop-filter:blur(18px);display:flex;flex-direction:column}.brand{padding:6px 13px 26px;color:#fff;text-decoration:none;font:700 19px "Space Grotesk";letter-spacing:.11em}.brand span{color:var(--lime);margin-right:8px}.side-label{padding:12px;color:#667084;font-size:10px;font-weight:700;letter-spacing:.16em}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb5c2;text-align:left;padding:12px 13px;border-radius:10px;transition:.18s}.nav button:hover,.nav button.active{background:rgba(216,239,114,.12);color:var(--lime)}.nav button span{display:inline-block;width:27px;color:inherit}.side-bottom{margin-top:auto;padding:12px;color:#737d90;font-size:12px;line-height:1.7}.side-bottom a{color:var(--lime);text-decoration:none}.main{min-width:0;padding:30px clamp(18px,4vw,58px) 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:34px}.eyebrow{color:var(--lime);font:600 10px "Space Grotesk";letter-spacing:.17em}.topbar h1{font:500 clamp(27px,3vw,38px) "Space Grotesk";margin:7px 0 0}.connection{display:flex;align-items:center;gap:8px;color:#aeb5c2;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#e0ad52;box-shadow:0 0 12px currentColor}.dot.online{background:#a9d75a}.dot.offline{background:var(--red)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:17px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{min-height:42px;padding:0 13px;color:#fff;background:#121827;border:1px solid var(--line);border-radius:10px;outline:0}.toolbar input{flex:1;min-width:210px}.toolbar select{min-width:150px}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(216,239,114,.55)}.button{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:10px;color:#e5e8ed;background:rgba(255,255,255,.055);transition:.2s}.button:hover{border-color:var(--lime);color:var(--lime)}.button.primary{background:var(--lime);border-color:var(--lime);color:#11170b;font-weight:700}.button.danger:hover{border-color:var(--red);color:var(--red)}.button.small{min-height:31px;padding:0 9px;font-size:11px}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:0 0 18px}.heading h2{font:500 22px "Space Grotesk";margin:5px 0}.heading p{color:var(--muted);margin:0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:23px}.stat{padding:20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018))}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:12px;font:600 27px "Space Grotesk"}.stat small{display:block;margin-top:5px;color:#7e899c;font-size:11px}.panel{padding:19px;border:1px solid var(--line);border-radius:16px;background:rgba(16,21,34,.75);margin-bottom:18px}.panel h3{margin:0 0 15px;font:500 16px "Space Grotesk"}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:rgba(12,16,26,.72)}table{width:100%;min-width:790px;border-collapse:collapse}th,td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.055);text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#111725;color:#909aad;font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}td{color:#d5d9e1;font-size:12px}tr:last-child td{border:0}.actions{display:flex;gap:6px;white-space:nowrap}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.09);font-size:10px}.badge.paid,.badge.valid,.badge.available{color:#c7e782;background:rgba(172,214,94,.12)}.badge.pending,.badge.used,.badge.sold{color:#f4ca7c;background:rgba(242,184,88,.12)}.badge.cancelled,.badge.failed{color:#ff9a9a;background:rgba(255,120,120,.12)}.empty{text-align:center!important;padding:36px!important;color:var(--muted)}.poster{width:38px;height:54px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:8px}.notice{display:none;margin:0 0 16px;padding:12px 15px;border:1px solid rgba(255,133,133,.3);border-radius:10px;background:rgba(255,100,100,.08);color:#ffb0b0}.notice.show{display:block}.loading{color:var(--muted);padding:20px}.modal{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.modal.show{display:grid}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;padding:25px;border:1px solid var(--line);border-radius:20px;background:#101522;box-shadow:0 24px 90px #000}.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:19px}.dialog h2{margin:6px 0;font:500 25px "Space Grotesk"}.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:#fff;background:transparent;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{color:#929bad;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.field input,.field select,.field textarea{width:100%}.field textarea{padding:12px;min-height:86px}.dialog-actions{display:flex;gap:9px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;z-index:8;max-width:min(430px,calc(100vw - 40px));padding:13px 17px;border:1px solid var(--line);border-radius:12px;background:#172032;box-shadow:0 12px 38px #000;opacity:0;transform:translateY(10px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:none}.toast.error{border-color:rgba(255,133,133,.5);color:#ffb0b0}.hide{display:none!important}
    @media(max-width:1000px){.layout{grid-template-columns:205px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding-inline:22px}}
    @media(max-width:700px){.layout{display:block}.sidebar{position:relative;width:100%;height:auto;padding:12px;border:0;border-bottom:1px solid var(--line)}.brand{padding:5px 8px 12px}.side-label,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.nav button span{width:auto;margin-right:5px}.main{padding:22px 14px 45px}.topbar{align-items:flex-start;flex-direction:column;margin-bottom:24px}.cards{gap:9px}.stat{padding:14px}.stat strong{font-size:22px}.panel{padding:12px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.heading{align-items:flex-start;flex-direction:column}}
  </style>
  <style>
    body{background-color:#080b12;background-image:linear-gradient(90deg,rgba(5,7,13,.80),rgba(5,7,13,.48) 55%,rgba(5,7,13,.68)),url('https://images.hdqwalls.com/download/disney-plus-avengers-endgame-4k-jv-3840x2400.jpg');background-position:center,center 28%;background-size:cover;background-attachment:fixed}
    .sidebar{background:rgba(8,11,18,.70)}
    .stat,.panel{background:rgba(12,16,26,.70);backdrop-filter:blur(14px) saturate(125%);-webkit-backdrop-filter:blur(14px) saturate(125%);border-color:rgba(255,255,255,.15)}
    .table-wrap{background:rgba(9,13,22,.72);backdrop-filter:blur(10px)}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="/"><span>✦</span>STARFLY</a>
      <div class="side-label">CONTROL ROOM</div>
      <nav class="nav" id="nav">
        <button class="active" data-page="overview"><span>◫</span>Tổng quan</button>
        <button data-page="movies"><span>▣</span>Phim</button>
        <button data-page="showtimes"><span>◷</span>Suất chiếu</button>
        <button data-page="seats"><span>▦</span>Ghế</button>
        <button data-page="tickets"><span>▤</span>Vé</button>
        <button data-page="customers"><span>♙</span>Khách hàng</button>
        <button data-page="orders"><span>▧</span>Đơn hàng</button>
        <button data-page="foods"><span>♨</span>Bắp nước</button>
      </nav>
      <div class="side-bottom">STARFLY CINEMA<br/><a href="/">← Về trang chủ</a></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">STARFLY ADMINISTRATION</div><h1 id="pageTitle">Tổng quan</h1></div><div class="connection"><i class="dot" id="connectionDot"></i><span id="connectionText">Đang kết nối API</span><button class="button small" id="adminLogout" type="button">Đăng xuất</button></div></header>
      <div class="notice" id="notice" role="alert"></div>
      <section id="content"><div class="loading">Đang tải dữ liệu…</div></section>
    </main>
  </div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><div><div class="eyebrow">STARFLY CONTROL ROOM</div><h2 id="formTitle">Thêm dữ liệu</h2></div><button class="x" id="formClose" aria-label="Đóng">×</button></div><form id="editForm"><div class="form-grid" id="formFields"></div><div class="dialog-actions"><button class="button primary" type="submit">Lưu thông tin</button><button class="button" type="button" id="formCancel">Hủy</button></div></form></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    $("adminLogout").addEventListener("click", async () => { try { await fetch("/api/admin/logout", {method:"POST"}); } finally { location.replace("/admin/adminlogin.html"); } });
    const state = { page: "overview", query: "", status: "", showtimeId: "", movies: [], showtimes: [], rows: [], editing: null, toastTimer: 0 };
    const titles = { overview:"Tổng quan", movies:"Quản lý phim", showtimes:"Quản lý suất chiếu", seats:"Quản lý ghế", tickets:"Quản lý vé", customers:"Quản lý khách hàng", orders:"Quản lý đơn hàng", foods:"Quản lý bắp nước" };
    const esc = (v) => String(v ?? "—").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const money = (v) => `${Number(v || 0).toLocaleString("vi-VN")} đ`;
    async function api(url, options = {}) { const res = await fetch(url, { headers: {"Content-Type":"application/json"}, ...options }); const data = await res.json().catch(() => ({})); if (!res.ok) throw new Error(data.error || `Lỗi API (${res.status})`); return data; }
    function toast(message, error = false) { const el=$("toast"); el.textContent=message; el.classList.toggle("error",error); el.classList.add("show"); clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>el.classList.remove("show"),3600); }
    function showError(error) { $("notice").textContent=error.message || String(error); $("notice").classList.add("show"); $("connectionDot").className="dot offline"; $("connectionText").textContent="API chưa sẵn sàng"; }
    function statusBadge(status) { const s=String(status||""); return `<span class="badge ${esc(s)}">${esc(s)}</span>`; }
    function actionButtons(id, canEdit=true, canDelete=true) { return `<div class="actions">${canEdit?`<button class="button small" data-action="edit" data-id="${esc(id)}">Sửa</button>`:""}${canDelete?`<button class="button small danger" data-action="delete" data-id="${esc(id)}">Xóa</button>`:""}</div>`; }
    function setRows(headers, rows) { $("content").innerHTML=`<div class="heading"><div><div class="eyebrow">DATA MANAGEMENT</div><h2>${esc(titles[state.page])}</h2><p>${rows.length.toLocaleString("vi-VN")} bản ghi</p></div>${state.page==="foods"?"<span class='badge'>Danh mục chỉ xem qua API hiện tại</span>":""}</div><div class="toolbar"><input id="search" type="search" placeholder="Tìm theo tên, mã, email…" value="${esc(state.query)}"/><select id="statusFilter"><option value="">Tất cả trạng thái</option>${statusOptions(state.page)}</select>${state.page==="seats"?`<select id="showtimeFilter"><option value="">Chọn suất chiếu…</option>${state.showtimes.map(s=>`<option value="${esc(s.id)}" ${String(s.id)===state.showtimeId?"selected":""}>${esc(s.title)} · ${esc(s.show_date)} ${esc(s.show_time)} · ${esc(s.room)}</option>`).join("")}</select>`:""}${["movies","showtimes"].includes(state.page)?`<button class="button primary" data-action="add">＋ Thêm mới</button>`:""}<button class="button" data-action="refresh">⟳ Làm mới</button></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join(""):`<tr><td class="empty" colspan="${headers.length}">Không có dữ liệu phù hợp.</td></tr>`}</tbody></table></div>`;
      $("search")?.addEventListener("input", e=>{state.query=e.target.value; renderCurrent();}); $("statusFilter")?.addEventListener("change",e=>{state.status=e.target.value;renderCurrent();}); $("showtimeFilter")?.addEventListener("change",e=>{state.showtimeId=e.target.value;loadPage();}); }
    function statusOptions(page){ const opts={tickets:["valid","used","cancelled"],orders:["pending","confirmed","paid","cancelled","failed"],seats:["available","sold"]}[page]||[]; return opts.map(s=>`<option value="${s}" ${state.status===s?"selected":""}>${s}</option>`).join(""); }
    function filtered(rows, fields, statusField){ const q=state.query.trim().toLocaleLowerCase("vi"); return rows.filter(r=>(!q||fields.some(k=>String(r[k]??"").toLocaleLowerCase("vi").includes(q)))&&(!state.status||!statusField||String(r[statusField])===state.status)); }
    async function loadLookups(){ const [movies,showtimes]=await Promise.all([api("/api/movies"),api("/api/showtimes")]); state.movies=movies;state.showtimes=showtimes; }
    async function overview(){ const [movies,showtimes,tickets,customers,orders,foods]=await Promise.all([api("/api/movies"),api("/api/showtimes"),api("/api/tickets"),api("/api/customers"),api("/api/orders"),api("/api/food-items")]);state.movies=movies;state.showtimes=showtimes; const revenue=orders.filter(o=>["paid","confirmed"].includes(o.status)).reduce((n,o)=>n+Number(o.total_amount||0),0); const pending=orders.filter(o=>o.status==="pending").length; const recent=orders.slice(0,7); $("content").innerHTML=`<div class="heading"><div><div class="eyebrow">LIVE SNAPSHOT</div><h2>Hoạt động hệ thống</h2><p>Số liệu lấy trực tiếp từ API STARFLY</p></div><button class="button" data-action="refresh">⟳ Cập nhật</button></div><div class="cards"><article class="stat"><span>Phim đang quản lý</span><strong>${movies.length}</strong><small>Danh mục phim</small></article><article class="stat"><span>Suất chiếu</span><strong>${showtimes.length}</strong><small>Tất cả ngày chiếu</small></article><article class="stat"><span>Vé đã ghi nhận</span><strong>${tickets.length}</strong><small>${tickets.filter(t=>t.status==="valid").length} vé còn hiệu lực</small></article><article class="stat"><span>Khách hàng</span><strong>${customers.length}</strong><small>Hồ sơ trong STARFLY</small></article><article class="stat"><span>Đơn đang chờ</span><strong>${pending}</strong><small>Cần theo dõi thanh toán</small></article><article class="stat"><span>Doanh thu đã xác nhận</span><strong>${money(revenue)}</strong><small>Đơn paid / confirmed</small></article><article class="stat"><span>Đơn hàng</span><strong>${orders.length}</strong><small>${orders.filter(o=>o.status==="paid").length} đơn đã thanh toán</small></article><article class="stat"><span>Sản phẩm bắp nước</span><strong>${foods.length}</strong><small>Đang hiển thị cho khách</small></article></div><section class="panel"><h3>Đơn hàng gần đây</h3><div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Phim</th><th>Thời gian</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>${recent.length?recent.map(o=>`<tr><td>#${esc(o.id)}</td><td>${esc(o.full_name)}</td><td>${esc(o.title)}</td><td>${esc(o.show_date)} ${esc(o.show_time)}</td><td>${money(o.total_amount)}</td><td>${statusBadge(o.status)}</td><td><button class="button small" data-page-link="orders">Chi tiết</button></td></tr>`).join(""):`<tr><td class="empty" colspan="7">Chưa có đơn hàng.</td></tr>`}</tbody></table></div></section>`; }
    async function renderCurrent(){ try { let data;
      if(state.page==="movies"){data=state.movies.length?state.movies:await api("/api/movies");state.movies=data;state.rows=data;const rows=filtered(data,["id","title","genre","year"],null);setRows(["Poster","Phim","Năm","Thể loại","Rating","Trailer","Thao tác"],rows.map(m=>[`<img class="poster" src="${esc(m.poster)}" alt="" onerror="this.style.visibility='hidden'">`,esc(m.title),esc(m.year),esc(m.genre),esc(m.rating),m.trailer?"Có":"—",actionButtons(m.id)]));}
      if(state.page==="showtimes"){data=state.showtimes.length?state.showtimes:await api("/api/showtimes");state.showtimes=data;state.rows=data;const rows=filtered(data,["id","title","show_date","show_time","room"],null);setRows(["Phim","Ngày","Giờ","Phòng","Ghế","Thao tác"],rows.map(s=>[esc(s.title),esc(s.show_date),esc(s.show_time),esc(s.room),esc(s.total_seats),actionButtons(s.id,false,true)]));}
      if(state.page==="seats"){if(!state.showtimes.length)state.showtimes=await api("/api/showtimes");if(!state.showtimeId){state.rows=[];setRows(["Ghế"],[]);return;}data=await api(`/api/seats?showtimeId=${encodeURIComponent(state.showtimeId)}`);state.rows=data;const rows=filtered(data,["seat_number","status"],"status");setRows(["ID","Suất chiếu","Ghế","Trạng thái","Thao tác"],rows.map(s=>[esc(s.id),esc(state.showtimes.find(x=>String(x.id)===state.showtimeId)?.title),esc(s.seat_number),statusBadge(s.status),`<button class="button small" data-action="seat-toggle" data-id="${esc(s.id)}" data-status="${s.status}">${s.status==="sold"?"Mở ghế":"Đánh dấu đã bán"}</button>`]));}
      if(state.page==="tickets"){data=await api("/api/tickets");state.rows=data;const rows=filtered(data,["ticket_code","full_name","email","title","seat_number"],"status");setRows(["Mã vé","Khách hàng","Phim","Suất","Ghế","Giá","Trạng thái","Thao tác"],rows.map(t=>[esc(t.ticket_code),`${esc(t.full_name)}<br><small>${esc(t.email)}</small>`,esc(t.title),`${esc(t.show_date)} ${esc(t.show_time)}`,esc(t.seat_number),money(t.price),statusBadge(t.status),`<div class="actions"><select class="button small" data-action="ticket-status" data-id="${esc(t.id)}"><option value="valid" ${t.status==="valid"?"selected":""}>valid</option><option value="used" ${t.status==="used"?"selected":""}>used</option><option value="cancelled" ${t.status==="cancelled"?"selected":""}>cancelled</option></select><button class="button small danger" data-action="delete" data-id="${esc(t.id)}">Xóa</button></div>`]));}
      if(state.page==="customers"){data=await api("/api/customers");state.rows=data;const rows=filtered(data,["id","full_name","email","phone"],null);setRows(["ID","Khách hàng","Email","Điện thoại","Số vé","Đã chi","Trạng thái","Thao tác"],rows.map(c=>[esc(c.id),esc(c.full_name),esc(c.email),esc(c.phone),esc(c.ticket_count),money(c.total_spent),esc(c.status),actionButtons(c.id,true,true)]));}
      if(state.page==="orders"){data=await api("/api/orders");state.rows=data;const rows=filtered(data,["id","payment_content","full_name","phone","title"],"status");setRows(["Mã đơn","Khách hàng","Phim / suất","Vé","Bắp nước","Tổng tiền","Mã xác nhận / nội dung CK","Trạng thái","Thao tác"],rows.map(o=>[`#${esc(o.id)}`,`${esc(o.full_name)}<br><small>${esc(o.phone)}</small>`,`${esc(o.title)}<br><small>${esc(o.show_date)} ${esc(o.show_time)} · ${esc(o.room)}</small>`,esc(o.ticket_count),esc(o.food_quantity),money(o.total_amount),esc(o.payment_content),`<select class="button small" data-action="order-status" data-id="${esc(o.id)}"><option value="pending" ${o.status==="pending"?"selected":""}>pending</option><option value="confirmed" ${o.status==="confirmed"?"selected":""}>confirmed</option><option value="paid" ${o.status==="paid"?"selected":""}>paid</option><option value="cancelled" ${o.status==="cancelled"?"selected":""}>cancelled</option><option value="failed" ${o.status==="failed"?"selected":""}>failed</option></select>`,`<button class="button small danger" data-action="delete" data-id="${esc(o.id)}">Xóa</button>`]));}
      if(state.page==="foods"){data=await api("/api/food-items");state.rows=data;const rows=filtered(data,["id","name","category","description"],null);setRows(["ID","Món","Mô tả","Nhóm","Giá","Tình trạng"],rows.map(f=>[esc(f.id),`${esc(f.icon)} ${esc(f.name)}`,esc(f.description),esc(f.category),money(f.price),statusBadge("Đang bán")]));}
      $("connectionDot").className="dot online";$("connectionText").textContent="Đã kết nối API";$("notice").classList.remove("show");
    }catch(error){showError(error);$("content").innerHTML=`<div class="panel"><h2>Không tải được dữ liệu</h2><p>${esc(error.message)}</p><p>Hãy mở trang này qua server STARFLY tại <code>http://localhost:3000/admin/</code>.</p><button class="button" data-action="refresh">Thử lại</button></div>`;} }
    async function loadPage(){state.page=state.page||"overview";$("pageTitle").textContent=titles[state.page];document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));$("notice").classList.remove("show");$("content").innerHTML='<div class="loading">Đang tải dữ liệu…</div>';try{if(state.page==="overview"){await overview();$("connectionDot").className="dot online";$("connectionText").textContent="Đã kết nối API";}else{await loadLookups();await renderCurrent();}}catch(e){showError(e);$("content").innerHTML=`<div class="panel"><h2>Không tải được dữ liệu</h2><p>${esc(e.message)}</p><button class="button" data-action="refresh">Thử lại</button></div>`;}}
    function field(label,name,value="",type="text",full=false,placeholder=""){return `<div class="field ${full?"full":""}"><label for="f-${name}">${esc(label)}</label><input id="f-${name}" name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${["title","year","movieId","showDate","showTime","room","name","price"].includes(name)?"required":""}></div>`;}
    function selectField(label,name,value,options,full=false){return `<div class="field ${full?"full":""}"><label for="f-${name}">${esc(label)}</label><select id="f-${name}" name="${esc(name)}">${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`;}
    function openForm(kind,record=null){state.editing={kind,record};$("formTitle").textContent=(record?"Sửa ":"Thêm ")+({movie:"phim",showtime:"suất chiếu",food:"món bắp nước"}[kind]);let html="";if(kind==="movie"){html=field("Tên phim","title",record?.title)+field("Năm","year",record?.year,"number")+field("Thể loại","genre",record?.genre)+field("Rating","rating",record?.rating,"number")+field("Poster URL","poster",record?.poster,"url",true)+field("Backdrop URL","backdrop",record?.backdrop,"url",true)+field("Trailer URL","trailer",record?.trailer,"url",true)+`<div class="field full"><label>Mô tả</label><textarea name="description">${esc(record?.description||"")}</textarea></div>`;}if(kind==="showtime"){html=selectField("Phim","movieId",record?.movie_id||"",state.movies.map(m=>({value:m.id,label:m.title})),true)+field("Ngày chiếu","showDate",record?.show_date||new Date().toISOString().slice(0,10),"date")+field("Giờ chiếu","showTime",record?.show_time||"19:00","time")+field("Phòng","room",record?.room||"Phòng 1")+field("Số ghế","totalSeats",record?.total_seats||60,"number");}if(kind==="food"){html=field("Tên món","name",record?.name)+field("Giá","price",record?.price,"number")+selectField("Nhóm","category",record?.category||"snack",["popcorn","drink","snack","combo"].map(x=>({value:x,label:x})))+field("Icon","icon",record?.icon||"🍿")+field("Mô tả","description",record?.description,"text",true);}$("formFields").innerHTML=html;$("modal").classList.add("show");}
    async function saveForm(event){event.preventDefault();const {kind,record}=state.editing;const data=Object.fromEntries(new FormData(event.target).entries());try{if(kind==="movie"){data.year=Number(data.year);data.rating=Number(data.rating);await api(record?`/api/movies/${record.id}`:"/api/movies",{method:record?"PUT":"POST",body:JSON.stringify(data)});}else if(kind==="showtime"){data.movieId=Number(data.movieId);data.totalSeats=Number(data.totalSeats);if(record)throw new Error("API hiện tại chưa hỗ trợ sửa suất chiếu. Bạn có thể xóa suất chưa bán vé và tạo lại.");await api("/api/showtimes",{method:"POST",body:JSON.stringify(data)});}else if(kind==="food"){throw new Error("API hiện tại chỉ cho phép xem danh mục bắp nước; chưa có endpoint thêm/sửa món.");}$("modal").classList.remove("show");toast("Đã lưu dữ liệu.");state.movies=[];state.showtimes=[];await loadPage();}catch(e){toast(e.message,true);}}
    async function handleAction(action,id,button){try{if(action==="refresh"){state.movies=[];state.showtimes=[];await loadPage();return;}if(action==="add"){openForm(state.page==="movies"?"movie":"showtime");return;}if(action==="edit"){const rec=state.rows.find(r=>String(r.id)===String(id));if(state.page==="movies")openForm("movie",rec);else if(state.page==="customers"){const c=rec;const fullName=prompt("Họ tên",c.full_name);if(fullName===null)return;const email=prompt("Email",c.email);if(email===null)return;const phone=prompt("Số điện thoại",c.phone);if(phone===null)return;await api(`/api/customers/${id}`,{method:"PUT",body:JSON.stringify({fullName,email,phone})});toast("Đã cập nhật khách hàng.");await loadPage();}return;}if(action==="delete"){if(!confirm(`Xác nhận xóa mục #${id}? Thao tác này có thể không hoàn tác được.`))return;const endpoints={movies:`/api/movies/${id}`,showtimes:`/api/showtimes/${id}`,tickets:`/api/tickets/${id}`,customers:`/api/customers/${id}`,orders:`/api/orders/${id}`};const endpoint=endpoints[state.page];if(!endpoint)throw new Error("Mục này chưa hỗ trợ xóa.");await api(endpoint,{method:"DELETE"});toast("Đã xóa dữ liệu.");state.movies=[];state.showtimes=[];await loadPage();return;}if(action==="seat-toggle"){await api(`/api/seats/${id}`,{method:"PATCH",body:JSON.stringify({status:button.dataset.status==="sold"?"available":"sold"})});toast("Đã cập nhật trạng thái ghế.");await renderCurrent();return;}if(action==="ticket-status"){await api(`/api/tickets/${id}`,{method:"PATCH",body:JSON.stringify({status:button.value})});toast("Đã cập nhật vé.");await renderCurrent();return;}if(action==="order-status"){await api(`/api/orders/${id}/status`,{method:"PATCH",body:JSON.stringify({status:button.value})});toast("Đã cập nhật đơn hàng.");await renderCurrent();}}catch(e){toast(e.message,true);}}
    $("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(!b)return;state.page=b.dataset.page;state.query="";state.status="";loadPage();});$("content").addEventListener("click",e=>{const link=e.target.closest("[data-page-link]");if(link){state.page=link.dataset.pageLink;loadPage();return;}const b=e.target.closest("[data-action]");if(b)handleAction(b.dataset.action,b.dataset.id,b);});$("content").addEventListener("change",e=>{if(e.target.matches("[data-action='ticket-status'],[data-action='order-status']"))handleAction(e.target.dataset.action,e.target.dataset.id,e.target);});$("editForm").addEventListener("submit",saveForm);$("formClose").onclick=$("formCancel").onclick=()=>$("modal").classList.remove("show");$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").classList.remove("show");});document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").classList.remove("show");});
    loadPage();
  </script>
</body>
</html>
