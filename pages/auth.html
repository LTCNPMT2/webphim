<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />
  <title>STARFLY — Đăng nhập / Đăng ký</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="/"><span>✦</span> STARFLY</a>
    <section class="auth-card">
      <div class="eyebrow">STARFLY MEMBER</div>
      <h1>Tài khoản của bạn</h1>
      <p class="intro">Đăng nhập để xem vé và đặt vé nhanh hơn.</p>

      <div id="guestPanel">
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-mode="login">Đăng nhập</button>
          <button class="tab" type="button" data-mode="register">Đăng ký</button>
        </div>
        <form id="loginForm" class="form">
          <label>Email<input name="email" type="email" autocomplete="email" placeholder="ban@email.com" required /></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required /></label>
          <button class="submit" type="submit">Đăng nhập</button>
        </form>
        <form id="registerForm" class="form hidden">
          <label>Họ và tên<input name="fullName" autocomplete="name" placeholder="Tên của bạn" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" placeholder="ban@email.com" required /></label>
          <label>Số điện thoại<input name="phone" type="tel" autocomplete="tel" placeholder="09xxxxxxxx" required /></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Ít nhất 8 ký tự" required /></label>
          <button class="submit" type="submit">Tạo tài khoản</button>
        </form>
      </div>

      <section id="accountPanel" class="account hidden">
        <div class="member-mark">✦</div>
        <h2 id="memberName"></h2>
        <p id="memberEmail"></p>
        <button id="logoutButton" class="secondary" type="button">Đăng xuất</button>
      </section>

      <p id="message" class="message" role="status"></p>
      <a class="home-link" href="/">← Quay lại STARFLY</a>
    </section>
    <footer>© 2026 STARFLY · ĐIỆN ẢNH NGOÀI QUỸ ĐẠO</footer>
  </main>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
